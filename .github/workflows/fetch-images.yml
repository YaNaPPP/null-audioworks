name: Fetch generated images
on:
  push:
    paths: [images.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images listed in images.json
        run: |
          mkdir -p src-img
          python3 - <<'PY'
          import json, urllib.request
          for name, url in json.load(open('images.json')).items():
              urllib.request.urlretrieve(url, 'src-img/' + name)
              print('ok', name)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src-img
          git diff --cached --quiet || git commit -m "Add generated source images"
          git push
